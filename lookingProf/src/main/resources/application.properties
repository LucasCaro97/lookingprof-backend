#database properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:looking_prof}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.pattern.dateformat=HH:mm
spring.devtools.restart.enabled=true
spring.jpa.properties.hibernate.format_sql=true

frontendUrl=${FRONTEND_URL:http://localhost:3000}

jwt.secret=${JWT_SECRET:LookingProfDevOnlyChangeMe_32bytesMinKey!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload-dir=${UPLOAD_DIR:./uploads}

app.seed.catalog=${APP_SEED_CATALOG:true}
app.seed.demo-users=${APP_SEED_DEMO_USERS:false}
app.seed.georef-base-url=${GEORREF_BASE_URL:https://apis.datos.gob.ar/georef/api}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:Dev12345!}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
